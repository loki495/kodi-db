services:
  kodi-db:
    image: mariadb:10.6
    container_name: kodi-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kodi}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --skip-ssl --skip-secure-auth --require_secure_transport=OFF
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - ./data:/var/lib/mysql
